[workspace]
members = [
  "crates/lp2ln-core-v2",
  "crates/lp2lnd",
  "crates/lp2ln-db-export",
  "crates/lp2ln-app-protocol",
  "crates/lp2ln-app-sdk",
]
exclude = [
  "archive/lp2ln-core",
  "archive/lp2ln-gateway",
  # P5/P7 stubs without Cargo.toml — restore when those phases start.
  "crates/lp2lnd-vpn",
  "crates/lp2ln-magic-folder",
]
resolver = "2"

[patch.crates-io]
# h3-quinn 0.0.6 accesses quinn::StreamId.0 which became private in quinn 0.11.x;
# this local copy replaces .0 with u64::from(id) using the stable From impl.
h3-quinn = { path = "vendor/h3-quinn" }