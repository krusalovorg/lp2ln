[package]
name = "lp2ln-core"
version = "0.0.2"
edition = "2021"
rust-version = "1.81"
build = "build.rs"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.89"
stun-client = "0.1.4"
async-std = "1.12.0"
toml = "0.8.10"
lazy_static = "1.5.0"
base64 = "0.22.1"
colored = "3.0.0"
redb = "2.4.0"
k256 = { version = "0.13.4", features = ["ecdsa", "sha256", "ecdh"] }
rand = { version = "0.9.1", features = ["std"] }
rand_core = "0.9.3"
hex = "0.4.3"
wasmtime = "29.0.1"
sha2 = "0.10.8"
chacha20poly1305 = "0.10.1"
futures = "0.3"
hyper = { version = "1.6", features = ["http1", "server"] }
http-body-util = "0.1.3"
bytes = "1.10.1"
hyper-util = { version = "0.1", features = ["tokio"] }
flate2 = "1.0"
mime_guess = "2.0.4"
dashmap = "6.1.0"
chrono = "0.4"
bincode = "1.3.3"
async-trait = "0.1"
uuid = { version = "1.12.1", features = ["v4", "fast-rng", "macro-diagnostics"] }
async-lock = "=3.0.0"
indexmap = "=2.0.0"

[lib]
name = "lp2ln_core"
path = "src/lib.rs"