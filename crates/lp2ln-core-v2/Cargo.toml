[package]
name = "lp2ln-core-v2"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.89"
stun-client = "0.1.4"
async-std = "1.12.0"
toml = "0.8.10"
lazy_static = "1.5.0"
base64 = "0.22.1"
colored = "3.0.0"
redb = "2.4.0"
k256 = { version = "0.13.4", features = ["ecdsa", "sha256", "ecdh"] }
rand = { version = "0.9.1", features = ["std"] }
rand_core = "0.9.3"
hex = "0.4.3"
sha2 = "0.10.8"
chacha20poly1305 = "0.10.1"
futures = "0.3"
bytes = "1.10.1"
flate2 = "1.0"
dashmap = "6.1.0"
bincode = "1.3.3"
async-trait = "0.1"
uuid = { version = "1.12.1", features = ["v4", "fast-rng", "macro-diagnostics"] }
chrono = "0.4"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
rcgen = "0.13"
h3 = "0.0.5"
h3-quinn = "0.0.6"
http = "1"

[dev-dependencies]
rcgen = "0.13"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "transport_bench"
harness = false

[[bench]]
name = "node_bench"
harness = false

[lib]
name = "lp2ln_core_v2"
path = "src/lib.rs"